services:

  mongo:
    image: mongo
    container_name: mongo

    ports:
      - "27017:27017"

  backend:
    image: irfaanpk/backend:${IMAGE_TAG}
    container_name: backend

    ports:
      - "5000:5000"

    depends_on:
      - mongo

  frontend:
    image: irfaanpk/frontend:${IMAGE_TAG}
    container_name: frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend
